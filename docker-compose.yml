services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=appdb;Username=appuser;Password=apppassword123
      Jwt__Key: CambiaEstaClaveSuperSecretaDeAlMenos32Chars!
      Jwt__Issuer: backend
      Jwt__Audience: frontend
      Jwt__AccessTokenMinutes: 15
      Jwt__RefreshTokenDays: 7
      Storage__RootPath: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

volumes:
  pgdata:
  uploads_data: