services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo_password_123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Descomenta estas 2 líneas solo si quieres abrir la base con DBeaver o pgAdmin
    # (solo accesible desde tu propia computadora).
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Valores de demostración: funcionan sin crear ningún archivo .env.
      # En un servidor real, defínelos en un archivo .env o como variables de entorno.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=appdb;Username=app;Password=${DB_PASSWORD:-demo_password_123}"
      Jwt__Key: ${JWT_KEY:-clave-de-demostracion-cambiala-en-produccion-0123456789}
      # Administrador inicial (se crea una sola vez si no existe).
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Email: ${ADMIN_EMAIL:-admin@correo.com}
      Admin__Password: ${ADMIN_PASSWORD:-AdminDemo12345}
      # Páginas del frontend autorizadas para llamar a la API desde el navegador.
      Cors__AllowedOrigins__0: "http://localhost:8081"
      Cors__AllowedOrigins__1: "http://127.0.0.1:8081"
    volumes:
      # Aquí se guardarán los archivos que suban los usuarios.
      - uploads:/app/uploads
    ports:
      - "8080:8080"

volumes:
  pgdata:
  uploads:
