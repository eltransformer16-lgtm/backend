services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo accesible desde tu propia computadora, no desde la red.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=appdb;Username=app;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en el archivo .env}
    ports:
      - "8080:8080"

volumes:
  pgdata:
